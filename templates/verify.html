<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marking Attendance</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #333; margin-bottom: 10px; }
        h3 { color: #666; font-weight: normal; margin-bottom: 20px; }
        
        .camera-box {
            border: 5px solid white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 640px;
            height: 480px;
            background: #000;
        }
        
        .btn-home {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Marking Attendance</h1>
    <h3>Subject: <strong>{{ subject }}</strong></h3>

    <div class="camera-box">
        <img src="{{ url_for('verify_feed', subject=subject) }}" width="640" height="480" />
    </div>

    <a href="/" class="btn-home">Back to Home</a>

</body>
</html>
