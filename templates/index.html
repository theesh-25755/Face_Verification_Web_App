<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <style>
        /* --- HOME PAGE SPECIFIC STYLES --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .home-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .home-container h1 {
            color: #0056b3;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .home-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 15px 0;
            font-size: 18px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 500;
            box-sizing: border-box; /* Ensures padding doesn't widen the button */
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Green Button for Attendance */
        .btn-verify {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
        }

        /* Blue Button for Admin */
        .btn-admin {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        }

        /* Gray Button for Dashboard */
        .btn-logs {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="home-container">
        <h1>Attendance System</h1>
        <p>Select an option to proceed</p>
        
        <a href="/verify" class="btn btn-verify">Mark Attendance</a>
        <a href="/login" class="btn btn-admin">Admin Login</a>
        <a href="/dashboard" class="btn btn-logs">View Logs</a>

        
    </div>

</body>
</html>
